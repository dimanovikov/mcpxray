[project]
name = "mcpscore"
version = "0.1.0"
description = "Static linter + 0-100 scorecard for MCP servers. Catches tool poisoning, secret leaks, schema drift and more — locally, deterministically, in CI."
readme = "README.md"
authors = [
    { name = "Mitia", email = "mitia@cloudroad.io" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
mcpscore = "mcpscore.cli:app"

# External plugins self-register via these entry-point groups (built-ins load
# directly through decorator-based registries — see src/mcpscore/{extract,rules}).
[project.entry-points."mcpscore.extractors"]
[project.entry-points."mcpscore.rules"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# typer/click use call expressions as default arguments by design (B008).
[tool.ruff.lint.per-file-ignores]
"src/mcpscore/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]
