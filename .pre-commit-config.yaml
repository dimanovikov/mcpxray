# Pre-commit hooks for mcpscore.
# Uses the project's own ruff via `uv run` (single source of truth — no version
# drift between local dev, CI, and this hook).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true
