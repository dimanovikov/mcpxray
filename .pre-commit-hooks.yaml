# Declares `mcpscore` as a pre-commit hook so any MCP-server repo can run it on
# every commit. Add to your repo's `.pre-commit-config.yaml`:
#
#   - repo: https://github.com/cloudroad-io/mcpscore
#     rev: v0.2.0            # pin to a release tag
#     hooks:
#       - id: mcpscore
#         args: ["./src"]    # path to the server source to scan
#
# The hook runs `mcpscore scan --check <path>` and fails the commit on any
# ERROR finding (tool poisoning, leaked secrets, RCE). Requires `mcpscore` on
# PyPI; if installed locally instead (`uv tool install mcpscore`), set
# `language: system` in the hook entry.
- id: mcpscore
  name: mcpscore
  description: Lint an MCP server against the OWASP MCP Top-10 (MCP101-109); fails the commit on any ERROR finding.
  entry: mcpscore scan --check
  language: python
  pass_filenames: false
  additional_dependencies: ["mcpscore"]
