# Declares `mcpxray` as a pre-commit hook so any MCP-server repo can run it on
# every commit. Add to your repo's `.pre-commit-config.yaml`:
#
#   - repo: https://github.com/cloudroad-io/mcpxray
#     rev: v0.2.0            # pin to a release tag
#     hooks:
#       - id: mcpxray
#         args: ["./src"]    # path to the server source to scan
#
# The hook runs `mcpxray scan --check <path>` and fails the commit on any
# ERROR finding (tool poisoning, leaked secrets, RCE). Requires the
# `mcpxray-cli` distribution on PyPI; if installed locally instead
# (`uv tool install mcpxray-cli`), set `language: system` in the hook entry.
- id: mcpxray
  name: mcpxray
  description: Lint an MCP server against the OWASP MCP Top-10 (MCP101-109); fails the commit on any ERROR finding.
  entry: mcpxray scan --check
  language: python
  pass_filenames: false
  additional_dependencies: ["mcpxray-cli"]
